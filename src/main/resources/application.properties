spring.application.name=RagLearning

spring.datasource.url=jdbc:postgresql://localhost:5433/ragdb
spring.datasource.username=raguser
spring.datasource.password=mysecretpassword

spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.dimensions=768

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}

rag.ingestion.enabled=false
rag.ingestion.source-dir=/Users/guillaume.elhadi/Developer/RagLearning/sources