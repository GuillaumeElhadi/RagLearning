spring.application.name=RagLearning

spring.datasource.url=jdbc:postgresql://localhost:5433/ragdb
spring.datasource.username=raguser
spring.datasource.password=mysecretpassword

spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=bge-m3-8k
spring.ai.ollama.embedding.truncate=false

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=devportal_knowledge
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.dimensions=1024

spring.ai.model.chat=anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-haiku-5-5

rag.ingestion.enabled=false
rag.ingestion.source-dir=/Users/guillaume.elhadi/Developer/RagLearning/sources